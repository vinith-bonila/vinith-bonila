<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Tech stack as rock layers: interface, service, intelligence, data">
<defs>
<pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#E4BE62" opacity=".35"/><circle cx="3" cy="3" r="1.3" fill="#E4BE62"/><circle cx="8" cy="7" r="1" fill="#E4BE62"/></pattern>
<pattern id="lime" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#2E5AAC" opacity=".15"/><path d="M0 .5H24M0 6.5H24M6 .5V6.5M18 6.5V12" stroke="#2E5AAC" stroke-width="1"/></pattern>
<pattern id="shale" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#9AA7A0" opacity=".25"/><path d="M1 4H9" stroke="#5D6B67" stroke-width="1.2"/></pattern>
<pattern id="base" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#2F7D4F" opacity=".18"/><path d="M0 14L14 0" stroke="#2F7D4F" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="330" rx="16" fill="#EEF1EC"/>
<text x="40" y="34" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#5D6B67">stratigraphic column - the stack I build on, top to bedrock</text>
<rect x="40" y="50" width="150" height="64" fill="url(#sand)" stroke="#1E2A2B" stroke-width="1"/><text x="222" y="78" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1E2A2B">Interface</text><text x="222" y="100" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#5D6B67">React, Next.js, TypeScript, Tailwind, Streamlit</text><rect x="40" y="114" width="150" height="64" fill="url(#lime)" stroke="#1E2A2B" stroke-width="1"/><text x="222" y="142" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1E2A2B">Service</text><text x="222" y="164" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#5D6B67">FastAPI, Pydantic, Docker, Render, Vercel</text><line x1="200" y1="114" x2="1160" y2="114" stroke="#CBD5CE"/><rect x="40" y="178" width="150" height="64" fill="url(#shale)" stroke="#1E2A2B" stroke-width="1"/><text x="222" y="206" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1E2A2B">Intelligence</text><text x="222" y="228" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#5D6B67">LLMs, RAG, agents, FAISS, BM25, HuggingFace, Groq, Whisper, spaCy</text><line x1="200" y1="178" x2="1160" y2="178" stroke="#CBD5CE"/><rect x="40" y="242" width="150" height="64" fill="url(#base)" stroke="#1E2A2B" stroke-width="1"/><text x="222" y="270" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#1E2A2B">Data</text><text x="222" y="292" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#5D6B67">Python, Pandas, NumPy, DuckDB, SQL, PostgreSQL, Supabase, Power BI</text><line x1="200" y1="242" x2="1160" y2="242" stroke="#CBD5CE"/>
</svg>