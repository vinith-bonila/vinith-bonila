<text x="52" y="170" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#1E2A2B">Vinith Bonila</text>
<text x="56" y="214" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" fill="#1E2A2B">AI product engineer</text>
<text x="56" y="268" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#5D6B67">Petroleum engineer who now builds AI agents,</text>
<text x="56" y="292" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#5D6B67">RAG systems and data products.</text>
<text x="56" y="330" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#5D6B67">I still work the way logs taught me:</text>
<text x="56" y="354" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" fill="#5D6B67">measure first, then decide.</text>
