<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Tech stack as rock layers: interface, service, intelligence, data">
<defs>
<pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#D6B257" opacity=".35"/><circle cx="3" cy="3" r="1.3" fill="#D6B257"/><circle cx="8" cy="7" r="1" fill="#D6B257"/></pattern>
<pattern id="lime" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#72A0EC" opacity=".15"/><path d="M0 .5H24M0 6.5H24M6 .5V6.5M18 6.5V12" stroke="#72A0EC" stroke-width="1"/></pattern>
<pattern id="shale" width="16" height="8" patternUnits="userSpaceOnUse"><rect width="16" height="8" fill="#5E6E68" opacity=".25"/><path d="M1 4H9" stroke="#93A39D" stroke-width="1.2"/></pattern>
<pattern id="base" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#5CC08A" opacity=".18"/><path d="M0 14L14 0" stroke="#5CC08A" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="330" rx="16" fill="#141D1B"/>
<text x="40" y="34" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#93A39D">stratigraphic column - the stack I build on, top to bedrock</text>
<rect x="40" y="50" width="150" height="64" fill="url(#sand)" stroke="#E4EBE7" stroke-width="1"/><text x="222" y="78" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#E4EBE7">Interface</text><text x="222" y="100" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#93A39D">React, Next.js, TypeScript, Tailwind, Streamlit</text><rect x="40" y="114" width="150" height="64" fill="url(#lime)" stroke="#E4EBE7" stroke-width="1"/><text x="222" y="142" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#E4EBE7">Service</text><text x="222" y="164" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#93A39D">FastAPI, Pydantic, Docker, Render, Vercel</text><line x1="200" y1="114" x2="1160" y2="114" stroke="#2C3B37"/><rect x="40" y="178" width="150" height="64" fill="url(#shale)" stroke="#E4EBE7" stroke-width="1"/><text x="222" y="206" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#E4EBE7">Intelligence</text><text x="222" y="228" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#93A39D">LLMs, RAG, agents, FAISS, BM25, HuggingFace, Groq, Whisper, spaCy</text><line x1="200" y1="178" x2="1160" y2="178" stroke="#2C3B37"/><rect x="40" y="242" width="150" height="64" fill="url(#base)" stroke="#E4EBE7" stroke-width="1"/><text x="222" y="270" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#E4EBE7">Data</text><text x="222" y="292" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#93A39D">Python, Pandas, NumPy, DuckDB, SQL, PostgreSQL, Supabase, Power BI</text><line x1="200" y1="242" x2="1160" y2="242" stroke="#2C3B37"/>
</svg>